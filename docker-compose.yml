version: "3.8"

networks:
  loki-net:
    driver: bridge
  # Red externa de simon-mvp: da acceso a simon-miniio (almacen de trazas)
  # y permite que simon-workers alcance al collector sin salir a internet.
  apastar:
    name: apastar
    external: true

volumes:
  loki-data:
  grafana-data:
  prometheus-data:
  tempo-data:

services:
  # ──────────────────────────────────────────
  # Loki — almacén de logs
  # ──────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.5
    container_name: loki
    ports:
      - "3200:3100"
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - loki-net
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Promtail — recolector / agente de logs
  # ──────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.5
    container_name: promtail
    volumes:
      - ./config/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro # logs del sistema host
      - /var/lib/docker/containers:/var/lib/docker/containers:ro # logs Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro # socket Docker (discovery de contenedores)
      - ${NPM_LOGS_PATH}:/mnt/npm-logs:ro # logs de Nginx Proxy Manager (stack separado)
    command: -config.file=/etc/promtail/config.yml
    networks:
      - loki-net
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Prometheus — métricas del sistema
  # ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      # Receptor de remote-write: por aquí entran las métricas RED que el
      # metrics-generator de Tempo deriva de los spans. Flag estable en 2.53,
      # pese a estar marcado como deprecado en favor de la config de web.
      - --web.enable-remote-write-receiver
    networks:
      - loki-net
    restart: unless-stopped

  # ──────────────────────────────────────────
  # node-exporter — métricas de host (CPU/RAM/disco/red)
  # ──────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - loki-net
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Tempo — almacén de trazas
  # ──────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.10.8
    container_name: tempo
    command: -config.file=/etc/tempo/tempo.yml -config.expand-env=true
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./config/tempo-config.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - loki-net
      - apastar          # para alcanzar simon-miniio
    restart: unless-stopped

  # ──────────────────────────────────────────
  # OTel Collector — única puerta de entrada de trazas
  # ──────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: otel-collector
    command: --config=/etc/otel/config.yml
    environment:
      - OTEL_INGEST_TOKEN=${OTEL_INGEST_TOKEN}
    ports:
      # Solo el puerto público se publica: lo consume Nginx Proxy Manager.
      # El 4318 (interno) NO se publica — los workers llegan por red Docker.
      - "127.0.0.1:4319:4319"
    volumes:
      - ./config/otel-collector-config.yml:/etc/otel/config.yml:ro
    networks:
      - loki-net
      - apastar          # para que simon-workers lo alcance
    depends_on:
      - tempo
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Grafana — visualización y dashboards
  # ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3035:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GRAFANA_PG_USER=${GRAFANA_PG_USER}
      - GRAFANA_PG_PASSWORD=${GRAFANA_PG_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana-datasource.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - ./config/grafana-datasource-prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./config/grafana-datasource-tempo.yml:/etc/grafana/provisioning/datasources/tempo.yml:ro
      - ./config/grafana-datasource-postgres.yml:/etc/grafana/provisioning/datasources/postgres.yml:ro
      - ./config/alerting:/etc/grafana/provisioning/alerting:ro
      - ./config/grafana-dashboards-provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./config/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    networks:
      - loki-net
      - apastar          # para alcanzar simon-postgresql (dashboard de pipeline)
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped
