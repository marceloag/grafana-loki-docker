# Tempo 2.10.x — modo monolítico (todos los componentes in-process).
# Ver ADR 0001 de simon-mvp: docs/adr/0001-observabilidad-otel.md

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

# Tempo solo recibe del Collector, nunca directo de las apps.
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    # Retención de trazas: 14 días.
    block_retention: 336h
    compacted_block_retention: 1h

storage:
  trace:
    # S3 desde el principio, aunque hoy apunte a MinIO: el día que se migre a
    # S3 real solo cambian endpoint y credenciales, no los bloques.
    backend: s3
    s3:
      bucket: tempo-traces
      # container_name del MinIO de simon-mvp (ojo: lleva doble "i").
      endpoint: simon-miniio:9000
      access_key: ${MINIO_ROOT_USER}
      secret_key: ${MINIO_ROOT_PASSWORD}
      region: us-east-1
      insecure: true        # HTTP dentro de la red Docker
      forcepathstyle: true  # necesario con MinIO
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Métricas RED derivadas de los propios spans — no se instrumenta nada nuevo.
# Un Prometheus Agent interno hace remote_write al Prometheus del stack.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

# Sin esto el generator queda cargado pero inerte: los procesadores se
# habilitan por tenant, y el bloque `defaults` es el que aplica a todos.
# Histogramas clásicos, NO native histograms: en Prometheus 2.53 estos
# últimos siguen tras --enable-feature y son experimentales.
overrides:
  defaults:
    metrics_generator:
      processors:
        - span-metrics
        - service-graphs
