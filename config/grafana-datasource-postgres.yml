apiVersion: 1

datasources:
  - name: Simon Postgres
    type: postgres
    uid: simon-postgres
    access: proxy
    # Reached over the shared apastar network, same as Tempo reaches MinIO.
    url: simon-postgresql:5432
    database: simon
    user: ${GRAFANA_PG_USER}
    isDefault: false
    editable: true
    secureJsonData:
      password: ${GRAFANA_PG_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
