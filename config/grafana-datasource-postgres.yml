apiVersion: 1

datasources:
  - name: Simon Postgres
    type: postgres
    uid: simon-postgres
    access: proxy
    # The app's database is the `psql` container (aliases: psql, db) on the
    # apastar network — NOT `simon-postgresql`, which is a second, unused
    # Postgres 17 on the same host. The workers reach the same instance, via
    # the public 5.78.147.71:54320.
    url: psql:5432
    database: simon
    user: ${GRAFANA_PG_USER}
    isDefault: false
    editable: true
    secureJsonData:
      password: ${GRAFANA_PG_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
